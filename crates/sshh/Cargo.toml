[package]
publish = false  # git-only for now, not published to crates.io
name = "sshh"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A keyless SSH server over an already-authenticated byte stream."
repository = "https://github.com/theia-hq/services"

# A keyless SSH server over an already-authenticated byte stream. Its own crate so its heavy,
# security-sensitive dependency tree (russh, ssh-key, pty-process) sits behind the composing consumer's
# `ssh` feature and never lands in a lean client that only reaches out.
[dependencies]
nauthy.workspace = true
tightbeam-handler.workspace = true

blake3 = "1"
libc.workspace = true
pty-process.workspace = true
russh.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[lints]
workspace = true
