[package]
publish = false  # git-only for now, not published to crates.io
name = "fetch"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An HTTP origin fetch a keyed node performs on an admitted requester's behalf."
repository = "https://github.com/theia-hq/services"

[dependencies]
tightbeam-handler.workspace = true

futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
tracing.workspace = true
# The URL parser `reqwest::Url` is; named directly so its parse error is a typed source, not a message.
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
